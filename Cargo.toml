[package]
name = "message-board"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
